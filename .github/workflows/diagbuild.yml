name: diag-build-xcode
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Pin commit 1.3.4
        shell: bash
        run: |
          git remote add upstream https://github.com/FlowCrypt/flowcrypt-ios.git || true
          git fetch upstream master --tags --depth=5000
          git checkout 2323e740318b96e69c507659d58a072d786b20ed
          sed -i '' 's/objectVersion = 100;/objectVersion = 77;/' FlowCrypt.xcodeproj/project.pbxproj
      - name: Force HTTPS submodules
        shell: bash
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
      - name: Boot iOS 18 sim
        shell: bash
        run: |
          UDID=$(xcrun simctl list devices available -j | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const j=JSON.parse(d).devices;let b=null,bv=0;const v=rt=>parseFloat((rt.match(/iOS-([0-9-]+)/)||[])[1]?.replace(/-/g,'.')||'0');for(const rt of Object.keys(j))for(const dev of j[rt]){const vv=v(rt);if(dev.isAvailable&&/^iPhone/.test(dev.name)&&vv>=18&&vv<19){if(!b||vv>bv){b=dev.udid;bv=vv;}}}console.log(b);});")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b
      - name: Try build on each Xcode (no -e, continue through all)
        shell: bash
        run: |
          set +e
          WINNER=""
          for XC in 16.4 16.3 16.2 16.1 16.0 26.0 26.1 26.2 26.3; do
            APP="/Applications/Xcode_${XC}.app"
            [ -d "$APP" ] || { echo "SKIP $XC (not installed)"; continue; }
            echo "============================================"
            echo "=== TRY Xcode $XC ==="
            DEVELOPER_DIR="$APP/Contents/Developer" xcodebuild -version
            DEVELOPER_DIR="$APP/Contents/Developer" xcodebuild -project FlowCrypt.xcodeproj \
              -scheme "Debug FlowCrypt" -configuration Debug -sdk iphonesimulator \
              -destination "id=$SIM_UDID" -derivedDataPath build_$XC \
              -skipPackagePluginValidation -skipMacroValidation \
              CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
              build > /tmp/b_$XC.log 2>&1
            RC=$?
            if [ $RC -eq 0 ]; then
              echo ">>> BUILD OK on Xcode $XC <<<"
              WINNER="$XC"
              break
            fi
            echo ">>> BUILD FAILED Xcode $XC (rc=$RC). Real compile errors:"
            grep -nE "error:|fatal error|cannot find|no such module|Undefined symbol|is unavailable|has no member|FlowCryptUI" /tmp/b_$XC.log | grep -iv "warning" | head -20
          done
          echo "============================================"
          echo "WINNER=$WINNER"
          [ -n "$WINNER" ] && echo "FOUND working Xcode: $WINNER" || echo "NO Xcode compiled the app"
